name: Build Salon Booking APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create . --platforms=android
      - name: Ensure Android internet permission and app name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in s:
              s = s.replace('<application', permission + '\n    <application', 1)
          s = s.replace('android:label="salon_booking"', 'android:label="SALON BOOKING"')
          s = s.replace("android:label='salon_booking'", "android:label='SALON BOOKING'")
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@mipmap/ic_launcher"')
          p.write_text(s)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Generate app launcher icon
        run: dart run flutter_launcher_icons
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: salon-booking-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
